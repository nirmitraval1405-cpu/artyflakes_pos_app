{% extends "base.html" %}
{% block title %}Login · Artyflakes POS{% endblock %}
{% block auth_content %}
<div class="login-page d-flex align-items-center justify-content-center">
  <div class="card shadow-sm login-card">
    <div class="card-body p-4">
      <h4 class="brand mb-1"><i class="bi bi-palette2"></i> Artyflakes POS</h4>
      <p class="text-muted small mb-4">Sign in to continue</p>
      <form method="post">
        {% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger py-2">Wrong username or password.</div>{% endif %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
